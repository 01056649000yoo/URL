<svg width="320" height="92" viewBox="0 0 320 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="샘링크 로고">
  <defs>
    <!-- Modern Gradient for the Squircle Icon -->
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Dual Tone Gradient for "링크" Word -->
    <linearGradient id="word-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Logo Elements -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#090D1A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Squircle Base with premium glow and thin border -->
  <g transform="translate(12 14)" filter="url(#icon-shadow)">
    <!-- Main squircle shape (using smooth iOS-like corner radius) -->
    <rect x="0" y="0" width="64" height="64" rx="20" fill="url(#icon-grad)" />
    <!-- Glassmorphic border -->
    <rect x="0.5" y="0.5" width="63" height="63" rx="19.5" stroke="white" stroke-opacity="0.25" stroke-width="1.2" fill="none" />

    <!-- Futuristic Interlocking Link Icon -->
    <g stroke="white" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left loop -->
      <path d="M26 38H20C15.58 38 12 34.42 12 30C12 25.58 15.58 22 20 22H26" stroke-width="4.5" stroke-opacity="0.95"/>
      <!-- Right loop -->
      <path d="M38 26H44C48.42 26 52 29.58 52 34C52 38.42 48.42 42 44 42H38" stroke-width="4.5" stroke-opacity="0.95"/>
      <!-- Center connecting bar -->
      <line x1="23" y1="36.5" x2="41" y2="27.5" stroke-width="6.5"/>
    </g>
  </g>

  <!-- Beautiful Modern Typography -->
  <g transform="translate(96 20)">
    <!-- Brand Title with Dual Tone Gradient -->
    <text x="0" y="30" font-size="33" font-weight="900" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans KR', sans-serif" letter-spacing="-1.5">
      <tspan fill="#0F172A">샘</tspan>
      <tspan fill="url(#word-gradient)">링크</tspan>
    </text>

    <!-- Modern Subtitle with letter-spacing -->
    <text x="1.5" y="56" fill="#64748B" font-size="12" font-weight="800" font-family="'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans KR', sans-serif" letter-spacing="2">
      교육용 URL 단축 서비스
    </text>
  </g>
</svg>
