name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Copy .env.local from host
        run: cp /Users/seunghyeonmaegmini/URL/.env.local .

      - name: Build docker image
        run: |
          BUILD_COMMIT="$(git rev-parse --short HEAD)" \
            docker compose --env-file .env.local build --no-cache

      - name: Restart docker stack
        run: docker compose --env-file .env.local up -d --remove-orphans

      - name: Verify container
        run: |
          sleep 5
          docker ps --filter "name=samlink-app" --format "{{.Status}}"
