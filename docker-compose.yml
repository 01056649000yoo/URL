services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samlink-app
    env_file:
      - .env.local
    ports:
      - "3002:3000"
    restart: unless-stopped

  cleanup:
    image: curlimages/curl:8.12.1
    container_name: samlink-cleanup
    depends_on:
      - app
    environment:
      CLEANUP_URL: http://app:3000/api/cleanup-expired
      CLEANUP_INTERVAL_SECONDS: "3600"
      CLEANUP_TOKEN: "${SHORTENER_ADMIN_TOKEN}"
    command:
      - sh
      - -c
      - |
        while true; do
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $$CLEANUP_TOKEN" \
            "$$CLEANUP_URL" || true
          sleep "$$CLEANUP_INTERVAL_SECONDS"
        done
    restart: unless-stopped
