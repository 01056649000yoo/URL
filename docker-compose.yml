services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 배포 워크플로가 현재 커밋 해시를 넣어 준다. 없으면 화면에 unknown 으로 보인다.
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    container_name: samlink-app
    env_file:
      - .env.local
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=1777
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
    # 2026-08-17: 호스트를 한 바퀴 도는 host.docker.internal:8000 대신 같은 도커 네트워크에서
    # kong:8000 으로 직접 부른다. 그래야 supabase-kong 의 8000 포트를 바깥(0.0.0.0)에
    # 열어 둘 이유가 사라진다.
    networks:
      - default
      # 2026-08-28 샘링크를 아지트 스택으로 옮겼다. 자료는 아지트 DB 의 samlink 스키마에 있다.
      - agit
      - supabase

  # Cloudflare Tunnel은 이 스택이 아니라 같은 Mac의 jarvis-tunnel(+jarvis-caddy)이 담당한다.
  # 경로: Cloudflare → jarvis-tunnel → jarvis-caddy(:8001) → host.docker.internal:3002 → app
  # 그래서 .env.local 의 TRUST_PROXY_HEADERS=true 가 필요하다 (실제 방문자 IP 헤더 신뢰).

  cleanup:
    image: curlimages/curl:8.22.0
    container_name: samlink-cleanup
    depends_on:
      - app
    environment:
      CLEANUP_URL: http://app:3000/api/cleanup-expired
      CLEANUP_INTERVAL_SECONDS: "3600"
      # 2026-10-04: 사용 중인 링크 목적지를 하루 한 번(24바퀴마다) Safe Browsing 으로 다시 검사한다.
      RESCAN_URL: http://app:3000/api/rescan-links
      RESCAN_EVERY_LOOPS: "24"
      CLEANUP_TOKEN: "${SHORTENER_ADMIN_TOKEN}"
    command:
      - sh
      - -c
      - |
        # 앱이 먼저 뜨도록 잠깐 기다린다(전에는 첫 호출이 늘 연결 실패로 남았다).
        sleep 60
        loop=0
        while true; do
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $$CLEANUP_TOKEN" \
            "$$CLEANUP_URL" || true
          if [ $$((loop % RESCAN_EVERY_LOOPS)) -eq 0 ]; then
            curl --fail --silent --show-error --max-time 120 -X POST \
              -H "Authorization: Bearer $$CLEANUP_TOKEN" \
              "$$RESCAN_URL" || true
            echo
          fi
          loop=$$((loop + 1))
          sleep "$$CLEANUP_INTERVAL_SECONDS"
        done
    restart: unless-stopped

networks:
  agit:
    external: true
    name: agit_default
  supabase:
    external: true
    name: supabase_default
