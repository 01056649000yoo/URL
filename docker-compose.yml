services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samlink-app
    env_file:
      - .env.local
    ports:
      - "3002:3000"
    restart: unless-stopped

  # Cloudflare Tunnel: 공유기 포트포워딩 없이 Cloudflare를 통해서만 접속받는다.
  # .env.local 에 TUNNEL_TOKEN 이 설정되기 전까지는 재시작을 반복하지만 다른 서비스에는 영향 없음.
  # 설정 방법: docs/cloudflare-tunnel-setup.md
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: samlink-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"
    depends_on:
      - app
    restart: unless-stopped

  cleanup:
    image: curlimages/curl:8.12.1
    container_name: samlink-cleanup
    depends_on:
      - app
    environment:
      CLEANUP_URL: http://app:3000/api/cleanup-expired
      CLEANUP_INTERVAL_SECONDS: "3600"
      CLEANUP_TOKEN: "${SHORTENER_ADMIN_TOKEN}"
    command:
      - sh
      - -c
      - |
        while true; do
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $$CLEANUP_TOKEN" \
            "$$CLEANUP_URL" || true
          sleep "$$CLEANUP_INTERVAL_SECONDS"
        done
    restart: unless-stopped
